{% extends "vault/base.html" %}
{% block title %}Change password · LANVault{% endblock %}
{% block content %}
<main class="mx-auto max-w-xl px-6 py-10">
    <p class="text-sm font-semibold uppercase tracking-[.2em] text-sky-400">Account security</p>
    <h1 class="mt-2 text-4xl font-bold tracking-tight">Change password</h1>
    <form method="post" class="form-shell mt-8 space-y-5 rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-2xl shadow-slate-950/30">
        {% csrf_token %}
        {% if form.errors %}<div class="rounded-lg border border-rose-900/60 bg-rose-950/40 px-4 py-3 text-sm text-rose-300">Please correct the password fields below.</div>{% endif %}
        {% for field in form %}
        <label class="block text-sm font-medium text-slate-300">{{ field.label }}{{ field }}
            {% if field.errors %}<span class="mt-1 block text-xs text-rose-300">{{ field.errors|striptags }}</span>{% endif %}
        </label>
        {% endfor %}
        <div class="flex justify-end gap-3"><a href="/profile/" class="rounded-lg border border-slate-700 px-4 py-2.5 text-sm text-slate-300">Cancel</a><button class="rounded-lg bg-sky-500 px-4 py-2.5 text-sm font-semibold text-slate-950 hover:bg-sky-400">Update password</button></div>
    </form>
</main>
{% endblock %}
