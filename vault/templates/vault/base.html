<!doctype html>
<html lang="en" class="bg-slate-950">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LANVault{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'vault/tailwind.css' %}?v=2">
    <link rel="stylesheet" href="{% static 'vault/overrides.css' %}?v=3">
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <nav class="border-b border-slate-800 bg-slate-950/90 backdrop-blur">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
            <a href="/files/" class="flex items-center gap-3">
                <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-sky-500 font-black text-slate-950">L</span>
                <span class="text-lg font-semibold tracking-tight">LANVault</span>
            </a>
            {% if request.user.is_authenticated %}
            <div class="flex items-center gap-4 text-sm">
                <a href="/files/" class="text-slate-300 transition hover:text-white">Workspace</a>
                {% if request.user.is_staff %}
                <a href="/dashboard/" class="text-slate-300 transition hover:text-white">Cluster</a>
                <a href="/manage/" class="text-slate-300 transition hover:text-white">Manage</a>
                {% endif %}
                <a href="/profile/" class="hidden text-slate-500 transition hover:text-white sm:inline">{{ request.user.username }}</a>
                <form method="post" action="/logout/">
                    {% csrf_token %}
                    <button class="rounded-lg border border-slate-700 px-3 py-2 text-slate-300 transition hover:border-slate-500 hover:text-white">Sign out</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>
    <div id="toast-container" class="fixed right-5 top-20 z-50 flex w-[min(24rem,calc(100vw-2.5rem))] flex-col gap-3"></div>
    {% block content %}{% endblock %}
</body>
</html>
