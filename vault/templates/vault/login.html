{% extends "vault/base.html" %}
{% block title %}Sign in · LANVault{% endblock %}
{% block content %}
<main class="flex min-h-[calc(100vh-73px)] items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">
        <div class="mb-8">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[.25em] text-sky-400">Distributed storage</p>
            <h1 class="text-4xl font-bold tracking-tight">Welcome back.</h1>
            <p class="mt-3 text-slate-400">Sign in to access your department files.</p>
        </div>
        <form method="post" class="space-y-5 rounded-2xl border border-slate-800 bg-slate-900 p-7 shadow-2xl shadow-slate-950/50">
            {% csrf_token %}
            {% if form.errors %}
            <div class="rounded-lg border border-rose-900/60 bg-rose-950/40 px-4 py-3 text-sm text-rose-300">Your username or password was not recognised.</div>
            {% endif %}
            <input type="hidden" name="next" value="{{ next|default:'/files/' }}">
            <label class="block text-sm font-medium text-slate-300">Username
                <input name="username" autofocus required class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 outline-none transition placeholder:text-slate-600 focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20">
            </label>
            <label class="block text-sm font-medium text-slate-300">Password
                <input type="password" name="password" required class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20">
            </label>
            <button class="w-full rounded-lg bg-sky-500 px-4 py-3 font-semibold text-slate-950 transition hover:bg-sky-400">Sign in</button>
        </form>
    </div>
</main>
{% endblock %}
